# Settings for the swap orchestrator
healthCheckTimeout: 300 # How long to wait for the server to spin up before timing out
globalTTL: 3600 # Automatically unload models after 15 minutes of inactivity
includeAliasesInList: true # Exposes "qwen3.8" and "qwen3.8-default" in /v1/models list

store:
  path: /etc/llama-swap/stats.sqlite # Keeps activity logs on disk

metricsMaxInMemory: 1000 # Controls how many items stay buffered in RAM

# ==============================================================================
# Reusable llama-swap Macros
# ==============================================================================
macros:
  ik_llama_base: >-
    /usr/local/bin/ik-llama-server
    --port ${PORT}
    --host 0.0.0.0
    --main-gpu 0
    --image-min-tokens 1024
    --image-max-tokens 1024
    -ngl 99
    --merge-qkv
    -fa on
    --jinja
    --parallel-tool-calls
    --chat-template-file /models/templates/froggeric_chat_template.jinja
    --temp 0.6
    --top-p 0.95
    --top-k 20
    --min-p 0.0
    --repeat-penalty 1.0
    --chat-template-kwargs '{"preserve_thinking": true}'
    --ctx-checkpoints 5
    -ngld 99
    --spec-ckpt-mode auto

  qwen3_8_params: >-
    --alias "Qwen3.8-27B"

  qwen3_6_params: >-
    --model /models/qwen3.6-27b-gguf/ubergarm-mtp-iq4ks/Qwen3.6-27B-MTP-IQ4_KS.gguf
    --alias "Qwen3.6-27B"
    --mmproj /models/qwen3.6-27b-gguf/mmproj-F16.gguf
    --no-mmproj-offload
    --spec-type mtp:n_max=2,p_min=0.0

  kv_quant: >-
    -ctk q4_0 -ctv q4_0
    -khad -vhad

  qwen3_8_iq4_single_cmd: >-
    ${ik_llama_base}
    ${qwen3_8_params}
    -np 1
    --model /models/qwen3.8-27b-gguf/ubergarm-mtp-iq4ks/Qwen3.8-27B-MTP-IQ4_KS.gguf
    --mmproj /models/qwen3.8-27b-gguf/ubergarm-mtp-iq4ks/mmproj-Qwen3.8-27B-Q8_0.gguf
    --no-mmproj-offload
    --split-mode none
    --ctx-size 175000
    --spec-type mtp:n_max=2,p_min=0.6
    ${kv_quant}
    -b 1024 -ub 1024
    -cram 6144
    -t 1 -tb 8 -tm 8

# ==============================================================================
# Active Models
# ==============================================================================
models:
  # --- Qwen 3.8 Single GPU ---
  qwen3.8-4090:
    aliases:
      - "qwen3.8-single"
      - "qwen3.8-27B-MTP-IQ4_KS-4090"
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    cmd: ${qwen3_8_iq4_single_cmd}

  qwen3.8-3090:
    aliases:
      - "qwen3.8"
      - "qwen3.8-27b"
      - "qwen3.8-27B-MTP-IQ4_KS-3090"
      - "coding"
      - "assistant"
    env:
      - "CUDA_VISIBLE_DEVICES=1"
    cmd: ${qwen3_8_iq4_single_cmd}

  # --- Qwen 3.8 Dual GPU ---
  qwen3.8-ik-dual:
    aliases:
      - "qwen3.8-27B-UD-Q6_K_XL"
      - "qwen3.8-dual"
    env:
      - "CUDA_VISIBLE_DEVICES=0,1"
    cmd: >-
      ${ik_llama_base}
      ${qwen3_8_params}
      -np 1
      --model /models/qwen3.8-27b-gguf/unsloth/Qwen3.8-27B-UD-Q6_K_XL.gguf
      --mmproj /models/qwen3.8-27b-gguf/unsloth/mmproj-Qwen3.8-27B-Q8_0.gguf
      --split-mode layer
      --tensor-split 50,50
      --ctx-size 262144
      --spec-type mtp:n_max=2,p_min=0.6
      -ctk q8_0 -ctv q8_0 -ctkd q8_0 -ctvd q8_0
      -b 2048 -ub 2024
      -cram 12288
      -t 8 -tb 4 -tm 4

  qwen3.8-vllm:
    # cmd: docker compose -f /home/media/qwen38-27b-rtx3090/docker-compose.yml --profile single up
    # cmdStop: docker compose -f /home/media/qwen38-27b-rtx3090/docker-compose.yml --profile single down
    cmd: docker compose -f /home/media/qwen38-27b-rtx3090/docker-compose.yml --profile batch up
    cmdStop: docker compose -f /home/media/qwen38-27b-rtx3090/docker-compose.yml --profile batch down
    proxy: http://qwen38-27b-rtx3090-single:18020
    healthCheckTimeout: 300

  # --- Qwen 3.6 Single GPU (Thinking) ---
  qwen3.6-4090:
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    cmd: >-
      ${ik_llama_base}
      ${qwen3_6_params}
      -np 1
      --split-mode none
      --ctx-size 150000
      ${kv_quant}
      -b 1024 -ub 1024
      -cram 16384
      -t 1 -tb 8 -tm 8

  qwen3.5-A3B:
    env:
      - "CUDA_VISIBLE_DEVICES=1"
    cmd: >-
      ${ik_llama_base}
      -np 1
      --model /models/Qwen3.5-35B-A3B.i1-Q4_K_M.gguf
      --mmproj /models/Qwen3.5-35B-A3B.mmproj-f16.gguf
      ${kv_quant}
      --ctx-size 64000
      --spec-ckpt-mode auto
      -ngld 99
      --chat-template-kwargs '{"preserve_thinking": true}'
      --ctx-checkpoints 6

  qwen3.5-A3Bu:
    env:
      - "CUDA_VISIBLE_DEVICES=1"
    cmd: >-
      ${ik_llama_base}
      -np 1
      --model /models/Qwen3.5-35B-A3Bu.i1-Q4_K_M.gguf
      --mmproj /models/Qwen3.5-35B-A3B.mmproj-f16.gguf
      ${kv_quant}
      --ctx-size 64000
      --spec-ckpt-mode auto
      -ngld 99
      --chat-template-kwargs '{"preserve_thinking": true}'
      --ctx-checkpoints 6

peers:
  openrouter:
    proxy: https://openrouter.ai/api
    apiKey: ${env.OPENROUTER_API_KEY}
    models:
      - z-ai/glm-5.2:free
      - thinkingmachines/inkling:free
      - nvidia/nemotron-3.5-lightning:free
      - nvidia/nemotron-3-super-120b-a12b:free
      - poolside/laguna-xs-2.1:free
      - google/gemma-4-26b-a4b-it:free
  local-container:
    proxy: http://mediabox.theringfamily.org:18020
    models:
      - qwen3.8-27b-ext

# ==============================================================================
# Dynamic Profiles
# ==============================================================================
profiles:
  ik-4090:
    pins:
      "qwen3.8": "qwen3.8-4090"
      "qwen3.8-27b": "qwen3.8-4090"
      "coding": "qwen3.8-4090"
      "assistant": "qwen3.8-4090"
      "chat": "qwen3.8-4090"
  ik-3090:
    pins:
      "qwen3.8": "qwen3.8-3090"
      "qwen3.8-27b": "qwen3.8-3090"
      "coding": "qwen3.8-3090"
      "assistant": "qwen3.8-3090"
      "chat": "qwen3.8-3090"
  vllm:
    pins:
      "qwen3.8": "qwen3.8-vllm"
      "qwen3.8-27b": "qwen3.8-vllm"
      "coding": "qwen3.8-vllm"
      "assistant": "qwen3.8-vllm"
      "chat": "qwen3.8-vllm"
  vllm-external:
    pins:
      "qwen3.8": "qwen3.8-27b-ext"
      "qwen3.8-27b": "qwen3.8-27b-ext"
      "coding": "qwen3.8-27b-ext"
      "assistant": "qwen3.8-27b-ext"
      "chat": "qwen3.8-27b-ext"
  ik-dual:
    pins:
      "qwen3.8": "qwen3.8-ik-dual"
      "qwen3.8-27b": "qwen3.8-ik-dual"
      "coding": "qwen3.8-ik-dual"
      "assistant": "qwen3.8-ik-dual"
      "chat": "qwen3.8-ik-dual"
  external:
    pins:
      "coding": "google/gemma-4-26b-a4b-it:free"
      "assistant": "google/gemma-4-26b-a4b-it:free"
