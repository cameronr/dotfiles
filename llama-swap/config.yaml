# Settings for the swap orchestrator
healthCheckTimeout: 120 # How long to wait for the server to spin up before timing out
globalTTL: 900 # Automatically unload models after 15 minutes of inactivity
includeAliasesInList: true # Exposes "qwen3.8" and "qwen3.8-default" in /v1/models list

store:
  path: /etc/llama-swap/stats.sqlite # Keeps activity logs on disk

metricsMaxInMemory: 5000 # Controls how many items stay buffered in RAM

# ==============================================================================
# Reusable llama-swap Macros
# ==============================================================================
macros:
  ik_llama_base: >-
    /usr/local/bin/ik-llama-server
    --port ${PORT}
    --host 0.0.0.0
    --image-min-tokens 1024
    --image-max-tokens 1024
    -ngl 99
    -np 1
    --merge-qkv
    -fa on
    --jinja
    --parallel-tool-calls
    --chat-template-file /models/templates/froggeric_chat_template.jinja
    --temp 0.6
    --top-p 0.95
    --top-k 20
    --min-p 0.0
    --repeat-penalty 1.0

  qwen3_8_params: >-
    --model /models/qwen3.8-27b-gguf/ubergarm-mtp-iq4ks/Qwen3.8-27B-MTP-IQ4_KS.gguf
    --alias "Qwen3.8-27B"
    --mmproj /models/qwen3.8-27b-gguf/ubergarm-mtp-iq4ks/mmproj-Qwen3.8-27B-Q8_0.gguf
    --no-mmproj-offload
    --ctx-size 175000
    --spec-type mtp:n_max=2,p_min=0.6
    --spec-ckpt-mode auto
    -ngld 99
    --chat-template-kwargs '{"preserve_thinking": true}'
    --ctx-checkpoints 6

  qwen3_6_params: >-
    --model /models/qwen3.6-27b-gguf/ubergarm-mtp-iq4ks/Qwen3.6-27B-MTP-IQ4_KS.gguf
    --alias "Qwen3.6-27B"
    --mmproj /models/qwen3.6-27b-gguf/mmproj-F16.gguf
    --no-mmproj-offload
    --ctx-size 150000
    --spec-type mtp:n_max=2,p_min=0.0
    --spec-ckpt-mode auto
    -ngld 99
    --chat-template-kwargs '{"preserve_thinking": true}'
    --ctx-checkpoints 6

  kv_quant: >-
    -ctk q4_0 -ctv q4_0
    -khad -vhad

# ==============================================================================
# Active Models
# ==============================================================================
models:
  # --- Qwen 3.8 Single GPU ---
  qwen3.8-27B-MTP-IQ4_KS-single:
    aliases:
      - "qwen3.8"
      - "qwen3.8-27b"
      - "qwen3.8-27B-MTP-IQ4_KS"
      - "coding"
      - "assistant"
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    cmd: >-
      ${ik_llama_base}
      ${qwen3_8_params}
      --split-mode none
      --main-gpu 0
      ${kv_quant}
      -b 1024 -ub 1024
      -cram 6144
      -t 1 -tb 8 -tm 8

  # --- Qwen 3.8 Dual GPU ---
  qwen3.8-27B-MTP-IQ4_KS-dual:
    aliases:
      - "qwen3.8-dual"
    env:
      - "CUDA_VISIBLE_DEVICES=0,1"
    cmd: >-
      ${ik_llama_base}
      ${qwen3_8_params}
      --split-mode layer
      --tensor-split 1,1
      --main-gpu 0
      -ctk f16 -ctv f16
      -b 2048 -ub 2048
      -cram 16384
      -t 1 -tb 4 -tm 4

  qwen3.8-27B-vllm:
    cmd: docker compose -f /home/media/qwen38-27b-rtx3090/docker-compose.yml --profile single up
    cmdStop: docker compose -f /home/media/qwen38-27b-rtx3090/docker-compose.yml --profile single down
    proxy: http://qwen38-27b-rtx3090-single:18020
    healthCheckTimeout: 600

  # --- Qwen 3.6 Single GPU (Thinking) ---
  qwen3.6-27B-MTP-IQ4_KS:
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    cmd: >-
      ${ik_llama_base}
      ${qwen3_6_params}
      --split-mode none
      --main-gpu 0
      ${kv_quant}
      -b 1024 -ub 1024
      -cram 16384
      -t 1 -tb 8 -tm 8

  # --- Qwen 3 VL ---
  qwen3-vl-32b-instruct-q4_k_m.gguf:
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    cmd: >-
      ${ik_llama_base}
      --model /models/Huihui-Qwen3-VL-32B-Instruct-abliterated.Q4_K_M.gguf
      --mmproj /models/mmproj-qwen3-vl-32b-instruct-Q4_K_M.gguf
      ${kv_quant}
      --ctx-size 60000 
      --spec-ckpt-mode auto
      -ngld 99
      --chat-template-kwargs '{"preserve_thinking": true}'
      --ctx-checkpoints 6

  openrouter-laguna:
    proxy: https://openrouter.ai/api/v1
    headers:
      Authorization: "Bearer ${env.OPENROUTER_API_KEY}"

# ==============================================================================
# Dynamic Profiles
# ==============================================================================
profiles:
  ik:
    pins:
      "qwen3.8": "qwen3.8-27B-MTP-IQ4_KS-single"
      "qwen3.8-27b": "qwen3.8-27B-MTP-IQ4_KS-single"
      "qwen3.8-27B-MTP-IQ4_KS": "qwen3.8-27B-MTP-IQ4_KS-single"
      "coding": "qwen3.8-27B-MTP-IQ4_KS-single"
      "assistant": "qwen3.8-27B-MTP-IQ4_KS-single"
  vllm:
    pins:
      "qwen3.8": "qwen3.8-27B-vllm"
      "qwen3.8-27b": "qwen3.8-27B-vllm"
      "coding": "qwen3.8-27B-vllm"
      "assistant": "qwen3.8-27B-vllm"
  ik-dual:
    pins:
      "qwen3.8": "qwen3.8-27B-MTP-IQ4_KS-dual"
      "qwen3.8-27b": "qwen3.8-27B-MTP-IQ4_KS-dual"
      "qwen3.8-27B-MTP-IQ4_KS": "qwen3.8-27B-MTP-IQ4_KS-dual"
      "coding": "qwen3.8-27B-MTP-IQ4_KS-dual"
      "assistant": "qwen3.8-27B-MTP-IQ4_KS-dual"
  vllm-dual:
    pins:
      "qwen3.8": "qwen3.8-27B-vllm"
      "qwen3.8-27b": "qwen3.8-27B-vllm"
      "coding": "qwen3.8-27B-vllm"
      "assistant": "qwen3.8-27B-vllm"
  external:
    pins:
      "coding": "openrouter-laguna"
      "assistant": "openrouter-laguna"
